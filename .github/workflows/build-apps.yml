name: Build Desktop Apps (Linux, macOS, Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux (AppImage & Deb)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies for Tauri on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build Linux Bundles (Tauri 2)
        run: npm run tauri build

      - name: Upload Linux AppImage and DEB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Amigo-Linux-AppImage-and-Deb
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  build-macos:
    name: Build macOS (DMG & App)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build macOS DMG Bundle (Tauri 2)
        run: npm run tauri build

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amigo-macOS-DMG
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg

  build-windows:
    name: Build Windows (.EXE Installer)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows Executable (Tauri 2)
        run: npm run tauri build

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amigo-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/Amigo.exe
