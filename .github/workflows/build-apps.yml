name: Build Desktop Apps (Linux, macOS, Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux (AppImage & Deb)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies for Tauri on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build Linux Bundles (Tauri 2)
        run: npm run tauri build

      - name: Upload Linux AppImage and DEB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Amigo-Linux-AppImage-and-Deb
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  build-macos:
    name: Build macOS (DMG & App)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build macOS DMG Bundle (Tauri 2)
        run: |
          npm run tauri build
          echo "Signing app bundle with ad-hoc signature..."
          codesign --force --deep --sign - src-tauri/target/release/bundle/macos/Amigo.app
          codesign -vvv --deep --strict src-tauri/target/release/bundle/macos/Amigo.app
          
          echo "Repackaging verified DMG with Applications shortcut..."
          mkdir -p /tmp/amigo_dmg_staging
          rm -rf /tmp/amigo_dmg_staging/*
          cp -R src-tauri/target/release/bundle/macos/Amigo.app /tmp/amigo_dmg_staging/
          ln -s /Applications /tmp/amigo_dmg_staging/Applications
          rm -f src-tauri/target/release/bundle/dmg/*.dmg
          hdiutil create -volname "Amigo" -srcfolder /tmp/amigo_dmg_staging -ov -format UDZO src-tauri/target/release/bundle/dmg/Amigo_1.0.0_aarch64.dmg
          codesign --force --sign - src-tauri/target/release/bundle/dmg/Amigo_1.0.0_aarch64.dmg

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amigo-macOS-DMG
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg

  build-windows:
    name: Build Windows (.EXE Installer)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows Executable (Tauri 2)
        run: npm run tauri build

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amigo-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe

  publish-release:
    name: Publish Release Assets
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Collect installers
        run: |
          mkdir -p release-files
          find release-assets -type f \( -name "*.dmg" -o -name "*setup.exe" -o -name "*.AppImage" -o -name "*.deb" \) -exec cp {} release-files/ \;
          ls -la release-files

      - name: Upload assets to v1.0.0 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 release-files/* --clobber || gh release create v1.0.0 release-files/* --title "Amigo v1.0.0" --notes "Official Desktop Apps for Windows, macOS, and Linux. For macOS: if Gatekeeper says damaged, run: xattr -cr /Applications/Amigo.app"
